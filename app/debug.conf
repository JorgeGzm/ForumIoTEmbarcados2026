# Debug options, loaded by every build (tasks "West Build" and "Native Build").
# Off by default, so the image you flash or update is the release one.
# Uncomment to debug: the next build picks the change up, no pristine needed.

# -Og instead of -Os: stepping follows the code and no <optimized out>
# CONFIG_DEBUG_OPTIMIZATIONS=y

# Thread list in the debugger (cortex-debug "rtos": "Zephyr"). Needs a gdb
# server with Zephyr support (OpenOCD, J-Link, pyOCD): the ST-LINK_gdbserver
# used here has none, so with ST-Link this option does nothing
# CONFIG_DEBUG_THREAD_INFO=y
