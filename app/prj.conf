CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# === Display + LVGL ===
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_BAR=y
# LV_CONF_MINIMAL ships without a theme; without one, default bg_opa is
# transparent and NOTHING gets filled (screens included). Enable the
# default theme in dark mode.
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_THEME_DEFAULT_DARK=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y


# === User store: gzm user_mgr on LittleFS (gzm/ module) ===
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_PSA_CRYPTO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_GZM_USER_MGR=y
CONFIG_GZM_USER_MGR_SHELL=y
# Product rule: at most 50 users, the default admin included
CONFIG_GZM_USER_MGR_MAX=50
# "fs ls /lfs/users", "fs cat …": look at the files behind the users
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# === Misc ===
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_PRINTK=y
