# native_sim 64-bit: LVGL UI in an SDL window on the host.
CONFIG_LV_COLOR_16_SWAP=n
# Match the LVGL 16-bit render pipeline (default ARGB8888 leaves the
# window on the transparency grid).
CONFIG_SDL_DISPLAY_DEFAULT_PIXEL_FORMAT_RGB_565=y
# Bigger window for screencasts (160x80 panel shown at 2x).
CONFIG_SDL_DISPLAY_ZOOM_PCT=200

# User store on the simulated flash (RAM-backed NOR).
CONFIG_FLASH_SIMULATOR=y
