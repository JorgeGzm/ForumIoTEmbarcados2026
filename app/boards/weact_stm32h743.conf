# WeAct MiniSTM32H743 specific configuration (auto-loaded by Zephyr
# alongside prj.conf when building for this board).

# Console/shell over USB CDC ACM (device stack next)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y

# The ST7735R takes RGB565 big-endian over SPI. LVGL renders little-endian
# and byte-swaps the buffer right before flush when LV_COLOR_16_SWAP is set
# (compat hook in lv_refr.c). The board defaults it to y - keep it that way.
CONFIG_LV_COLOR_16_SWAP=y

# MCUboot integration (image state, confirm, slot info)
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_REBOOT=y

# Link the application at slot0 (requires --sysbuild builds)
CONFIG_USE_DT_CODE_PARTITION=y

# Keep feeding the IWDG started by MCUboot (see src/main.c)
CONFIG_WATCHDOG=y

# Keep SWD reachable while the core sleeps in the idle thread (WFI).
# Off by default outside CONFIG_DEBUG builds; without it the ST-Link cannot
# attach to the running app (no NRST wired for connect-under-reset).
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# User store: LittleFS with 4 KB blocks (the W25Q64 sector) instead of the
# default 64 KB layout: much faster erases on every user add/delete.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
