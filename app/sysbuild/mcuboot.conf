# MCUboot bootloader configuration for the WeAct MiniSTM32H743 demo.
# Serial recovery (mcumgr/SMP) on UART4 @ 921600; secondary slot on the
# QSPI NOR flash.

# ============================================
# Upgrade mode: SWAP using scratch partition
# ============================================
CONFIG_BOOT_PREFER_SWAP_MOVE=n
CONFIG_BOOT_SWAP_USING_SCRATCH=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=n

# ============================================
# Flash
# ============================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# slot0 = 896 KB, internal flash sector = 128 KB ->   7 sectors
# slot1 = 896 KB, QSPI NOR sector       =   4 KB -> 224 sectors
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# ============================================
# Serial recovery (mcumgr via UART4)
# ============================================
CONFIG_SERIAL=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# No dedicated DFU button: enter recovery for a short window after reset.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
# In ms, but boot_serial_read_console() only accounts the time between two
# k_uptime_get_32() calls per iteration: on this 480 MHz H7 the real window
# is ~2x the value (2500 -> ~5 s). Re-measure if MCUboot or the clock change.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=2500

# Buffers tuned for fast upload (SMP frame = 128 bytes)
CONFIG_BOOT_MAX_LINE_INPUT_LEN=128
CONFIG_BOOT_LINE_BUFS=128
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=16384

# Select the target slot via the mcumgr "image" parameter:
# image=2 -> slot1 (secondary). Without this, upload always goes to slot0!
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# image list (with hash) + image test/confirm over serial recovery
CONFIG_BOOT_SERIAL_IMG_GRP_HASH=y
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# ============================================
# Speed / validation
# ============================================
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_BOOT_IMG_HASH_ALG_SHA256=y
CONFIG_BOOT_FIH_PROFILE_OFF=y

# ============================================
# Serial recovery indication LED (on while the DFU window is open)
# ============================================
CONFIG_GPIO=y
CONFIG_MCUBOOT_INDICATION_LED=y

# ============================================
# Console off: the board console is USB CDC ACM, which does not exist
# inside the bootloader. UART4 belongs to mcumgr.
# ============================================
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=4096

# ============================================
# Watchdog (IWDG): MCUboot starts it with a 20 s timeout and feeds it
# during swap and serial recovery. The application must keep feeding it:
# a new image that hangs is reset and, being unconfirmed, rolled back.
# 20 s < IWDG max (~26 s) and covers validating the image on the QSPI NOR.
# ============================================
CONFIG_WATCHDOG=y
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_BOOT_WATCHDOG_SETUP_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_INSTALL_TIMEOUT_AT_BOOT=y
CONFIG_BOOT_WATCHDOG_TIMEOUT_MS=20000

# ============================================
# Debug: -Og instead of -Os for "MCUboot - Debug (ST-Link)".
# Off by default: the DFU window and the swap run slower at -Og.
# ============================================
# CONFIG_DEBUG_OPTIMIZATIONS=y
