CONFIG_ZTEST=y
CONFIG_LOG=y

# LittleFS on the same partition as the app (chosen app,users-partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# The library under test (gzm/ module)
CONFIG_GZM_FS_MGR=y

# LittleFS mount/format runs in main (suite setup): 1 KB default overflows
# on the board with the SPI NOR; same size as tests/user_mgr
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
