# Sysbuild configuration file.

# Enable MCUboot bootloader
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# MCUboot upgrade mode: SWAP using scratch partition.
# Supports different sector sizes between slots (internal 128 KB vs
# external QSPI NOR 4 KB) and enables automatic rollback.
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y

# Signed images (ECDSA P-256). Demo key generated locally by
# tools/keys/genkeys.sh. Never commit a production key.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/../../tools/keys/demo-ecdsa-p256.pem"

# Image encryption (ECIES P-256): the image stored in slot1 (external
# QSPI NOR) travels and rests encrypted; MCUboot decrypts during swap.
SB_CONFIG_BOOT_ENCRYPTION=y
SB_CONFIG_BOOT_ENCRYPTION_KEY_FILE="${APP_DIR}/../../tools/keys/demo-encryption-p256.pem"
