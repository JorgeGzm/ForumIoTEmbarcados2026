CONFIG_ZTEST=y
CONFIG_LOG=y

# LittleFS on the same partition as the app (chosen app,users-partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# The library under test (gzm/ module) and its crypto
CONFIG_PSA_CRYPTO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_GZM_USER_MGR=y
CONFIG_GZM_USER_MGR_SHELL=n
# Same limit as the app: the user_mgr_limit suite fills it up
CONFIG_GZM_USER_MGR_MAX=50
# Fewer PBKDF2 rounds than the product: same code path, faster tests
CONFIG_GZM_USER_MGR_PBKDF2_ITERATIONS=1000

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
