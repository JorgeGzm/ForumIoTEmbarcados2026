# Board test builds: tiny shell on the UART4 console so the UART flasher
# (tools/twister/flash_uart.py) can reboot into MCUboot serial recovery
# with "kernel reboot cold"; no SWD/NRST needed.
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_REBOOT=y
# printk/ztest output on the UART4 console (not implied by the shell)
CONFIG_UART_CONSOLE=y
# Twister attaches to the UART a fixed while after flashing (it waits for
# the port to "appear" and a by-id path never matches). Hold the test start
# so the ztest output is printed after Twister is listening.
CONFIG_BOOT_DELAY=60000

# Keep SWD reachable while the core sleeps in the idle thread (WFI).
# Off by default outside CONFIG_DEBUG builds; without it the J-Link cannot
# attach to the running app (no NRST wired for connect-under-reset).
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# MCUboot leaves the IWDG running (20 s): src/wdt_feed.c keeps feeding it.
CONFIG_WATCHDOG=y

# LittleFS with 4 KB blocks (the W25Q64 sector) instead of the default
# 64 KB layout: much faster erases.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
